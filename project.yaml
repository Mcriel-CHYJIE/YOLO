# =============================================================================
# Project Configuration — defines project identity & UI defaults
# All tabs (Training, Validate, Distill, Predict, Export, Dataset) read from here.
# Make a copy for a new project (e.g. fire detection) and just swap the file.
# =============================================================================

# ── Project Identity ──
project:
  name: YOLO Training Studio         # Window title
  task: detect                         # YOLO task (detect / segment / classify)
  classes: ['standing', 'sitting', 'squatting', 'fallen']
  names:                               # YOLO class definitions with descriptions
    0: standing                        # 站立
    1: sitting                         # 坐姿
    2: squatting                       # 蹲姿
    3: fallen                          # 摔倒/躺卧
  data_yaml: datasets/data.yaml         # Relative to project root
  tip: "🦶 Balanced → LS+SIoU+Rot15"    # Shown in Algorithm group box

# ── Training Defaults ──
training:
  model: yolo11n.pt                    # Model combo default
  model_options:                       # Available models in dropdown
    - yolo11n.pt
    - yolo11s.pt
    - yolo11m.pt
    - yolo11l.pt
    - yolo11x.pt
  epochs: 150                          # Reduced to prevent overfitting
  batch: 32                            # Keep batch size at 32
  imgsz: 640
  imgsz_options: [416, 512, 640, 800]
  optimizer: SGD                       # Changed to SGD for better generalization
  optimizer_options: [AdamW, Adam, SGD]
  device: auto                         # auto = detect GPU; fallback to CPU
  scheduler: cosine                    # cosine / linear
  scheduler_options: [Cosine, Linear]
  patience: 20                         # Reduced for earlier stopping
  lr0: 0.0003                          # Further reduced for stable training
  lrf: 0.001                           # Lower final learning rate
  warmup_epochs: 10                    # Increased for smoother start
  workers: 8
  momentum: 0.937                      # SGD momentum
  weight_decay: 0.0005                 # L2 regularization
  # Algorithm - Enhanced augmentation
  fl_gamma: 2.0                        # Increased for better class balance
  label_smoothing: 0.2                 # Stronger regularization
  iou: 0.65                            # Stricter matching
  close_mosaic: 25                     # Close mosaic earlier
  copy_paste: 0.5                      # Stronger copy-paste augmentation
  degrees: 30.0                        # More rotation variety
  multi_scale: true                    # Scale invariance
  hsv_h: 0.015                         # Hue augmentation
  hsv_s: 0.7                           # Saturation augmentation
  hsv_v: 0.4                           # Value (brightness) augmentation
  translate: 0.1                       # Translation augmentation
  scale: 0.9                           # Scale range 0.9-1.1
  flip_lr: 0.5                         # Horizontal flip

# ── Validation Defaults ──
validation:
  imgsz: 640
  batch: 32
  conf: 0.25
  iou: 0.45

# ── Distillation Defaults ──
distill:
  teacher: ''                          # Empty = auto-find latest runs/*/weights/best.pt
  student: yolo11n.pt
  epochs: 100
  batch: 16
  lr0: 0.001
  alpha: 0.3
  patience: 30
  imgsz: 640

# ── Prediction / Inference Defaults ──
predict:
  conf: 0.25
  iou: 0.45
  imgsz: 640

# ── Export Defaults ──
export:
  format: onnx
  format_options: [onnx, torchscript, ncnn, openvino, tensorrt, tflite, edgetpu, coreml]
  imgsz: 640
  imgsz_options: [320, 416, 640, 800, 1280]
  half: false
  int8: false
  nms: false
