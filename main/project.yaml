# =============================================================================
# Project Configuration — defines project identity & UI defaults
# All tabs (Training, Validate, Distill, Predict, Export, Dataset) read from here.
# Make a copy for a new project and just swap the file.
# =============================================================================

# ── Project Identity ──
project:
  name: YOLO Training Studio
  task: detect
  data_yaml: datasets/data.yaml
  tip: "yolo11n-CA-PW0.9-IoU0.85-conf0.60"

# ── Training Defaults ──
training:
  model: yolo11n.pt
  model_options:
    - yolo11s.pt
    - yolo11n.pt
    - yolo11n-p2.yaml
    - yolo11s-p2.yaml
    - yolov8s.pt
    - yolov8n.pt
    - yolov8n-p2.yaml
    - yolov8s-p2.yaml
  epochs: 300
  batch: 32
  imgsz: 640
  imgsz_options: [416, 512, 640, 720, 960]
  optimizer: AdamW
  optimizer_options: [AdamW, Adam, SGD]
  device: auto
  scheduler: Cosine
  scheduler_options: [Cosine, Linear]
  patience: 30
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 3
  workers: 8
  momentum: 0.937
  weight_decay: 0.0005
  cls_pw: 0.90
  iou: 0.85
  close_mosaic: 10
  # ── Training hyperparams ──
  dropout: 0.0
  warmup_momentum: 0.8
  amp: true
  cache: false
  lora_rank: 0
  # ── Augmentation ──
  copy_paste: 0.0
  degrees: 0.0
  multi_scale: false
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  translate: 0.1
  scale: 0.5
  flip_lr: 0.5
  flipud: 0.0
  shear: 0.0
  perspective: 0.0
  mosaic: 1.0
  mixup: 0.1
  # ── Network modules ──
  attention: CA
  cls_loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  iou_loss: ciou
  fusion: asff

# ── Validation Defaults ──
validation:
  imgsz: 640
  batch: 64
  conf: 0.60
  iou: 0.5

# ── Distillation Defaults ──
distill:
  teacher: ''
  student: models/yolo11n.pt
  epochs: 150
  batch: 24
  lr0: 0.002
  alpha: 0.5
  patience: 40
  imgsz: 640
  warmup_epochs: 5
  weight_decay: 0.0005
  momentum: 0.937

# ── Prediction / Inference Defaults ──
predict:
  conf: 0.60
  iou: 0.5
  imgsz: 640

# ── Export Defaults ──
export:
  format: onnx
  format_options: [onnx, torchscript, ncnn, openvino, tensorrt, tflite, edgetpu, coreml]
  imgsz: 640
  imgsz_options: [320, 416, 640, 800, 1280]
  half: false
  int8: false
  nms: false
