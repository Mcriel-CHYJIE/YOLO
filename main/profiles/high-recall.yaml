# 高召回率方案 — 安全覆盖推荐
# 宁可误报不可漏报，适合安全审查场景，事后回溯查漏补缺
name: 高召回率
tip: V11n-clsPW1.0-IoU0.7-conf0.35
training:
  model: yolo11n.pt
  epochs: 500
  batch: 64
  imgsz: 640
  optimizer: AdamW
  device: auto
  scheduler: Cosine
  patience: 40
  lr0: 0.0005
  lrf: 0.01
  warmup_epochs: 10
  workers: 12
  momentum: 0.937
  weight_decay: 0.0005
  cls_pw: 1.0
  iou: 0.7
  close_mosaic: 30
  copy_paste: 0.2
  degrees: 5.0
  multi_scale: false
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.15
  scale: 0.6
  flip_lr: 0.5
  flipud: 0.0
  attention: None
  mosaic: 1.0
  mixup: 0.3
