# 高精度低误报方案 — 生产部署推荐
# 误报率最低，适合监控告警场景，报警即处理，宁可漏报不可谎报
name: 高精度低误报
tip: V11n-CBAM-clsPW0.5-IoU0.8-conf0.55
training:
  model: yolo11n.pt
  epochs: 500
  batch: 32
  imgsz: 640
  optimizer: AdamW
  device: auto
  scheduler: Cosine
  patience: 40
  lr0: 0.0005
  lrf: 0.01
  warmup_epochs: 10
  workers: 12
  momentum: 0.937
  weight_decay: 0.0005
  cls_pw: 0.5
  iou: 0.8
  close_mosaic: 15
  copy_paste: 0.05
  degrees: 2.0
  multi_scale: false
  hsv_h: 0.01
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.3
  flip_lr: 0.3
  flipud: 0.0
  attention: CBAM
  mosaic: 1.0
  mixup: 0.1
