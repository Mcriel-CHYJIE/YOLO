# =============================================================================
# Preset Training Configurations
# Three optimized presets for different use cases
# Copy a preset into project.yaml 'training' section to use it
# =============================================================================

# ────────────────────────────────────────────────────────────────────────────
# PRESET 1: MAXIMUM ACCURACY (高精度模式)
# ─────────────────────────────────────────────────────────────────────────────
# Best for: Final production model, research, when accuracy is paramount
# Time cost: ~15-20 hours on RTX 5070 Ti
# Expected mAP@0.5: 0.92-0.95 (yolo11n), 0.95-0.97 (yolo11s)
# ─────────────────────────────────────────────────────────────────────────────

preset_maximum_accuracy:
  model: yolo11n.pt
  epochs: 800
  batch: 32
  imgsz: 640
  optimizer: AdamW
  device: auto
  scheduler: cosine
  patience: 100
  lr0: 0.002
  lrf: 0.01
  warmup_epochs: 15
  workers: 8
  momentum: 0.937
  weight_decay: 0.0005
  # Algorithm - Aggressive augmentation for maximum generalization
  fl_gamma: 1.5                        # Strong focal loss for hard cases
  label_smoothing: 0.1                 # Prevent overfitting
  iou: 0.7                             # Standard IoU
  close_mosaic: 30                     # Fine-tuning phase
  copy_paste: 0.2                      # Aggressive augmentation
  degrees: 15.0                        # Moderate rotation
  multi_scale: false                   # Fixed size for stability
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.15
  scale: 0.6
  flip_lr: 0.5


# ─────────────────────────────────────────────────────────────────────────────
# PRESET 2: BALANCED (均衡模式)  RECOMMENDED
# ─────────────────────────────────────────────────────────────────────────────
# Best for: Daily training, model iteration, good accuracy-speed balance
# Time cost: ~6-8 hours on RTX 5070 Ti
# Expected mAP@0.5: 0.90-0.93 (yolo11n), 0.93-0.95 (yolo11s)
# ─────────────────────────────────────────────────────────────────────────────

preset_balanced:
  model: yolo11n.pt
  epochs: 300
  batch: 32
  imgsz: 640
  optimizer: AdamW
  device: auto
  scheduler: cosine
  patience: 50
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 5
  workers: 8
  momentum: 0.937
  weight_decay: 0.0005
  # Algorithm - Moderate augmentation for stability
  fl_gamma: 1.0                        # Mild focal loss
  label_smoothing: 0.05                # Light smoothing
  iou: 0.7
  close_mosaic: 15                     # Shorter fine-tuning
  copy_paste: 0.1                      # Moderate augmentation
  degrees: 10.0                        # Conservative rotation
  multi_scale: false
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  flip_lr: 0.5


# ─────────────────────────────────────────────────────────────────────────────
# PRESET 3: FAST EXPERIMENT (快速实验模式)
# ─────────────────────────────────────────────────────────────────────────────
# Best for: Quick validation, hyperparameter testing, debugging
# Time cost: ~1-2 hours on RTX 5070 Ti
# Expected mAP@0.5: 0.85-0.88 (yolo11n), 0.88-0.91 (yolo11s)
# ─────────────────────────────────────────────────────────────────────────────

preset_fast_experiment:
  model: yolo11n.pt
  epochs: 100
  batch: 48                            # Higher batch for faster iterations
  imgsz: 640
  optimizer: Adam                      # Faster convergence for short training
  device: auto
  scheduler: linear                    # Simpler scheduler
  patience: 20
  lr0: 0.001
  lrf: 0.1
  warmup_epochs: 3
  workers: 8
  momentum: 0.937
  weight_decay: 0.0005
  # Algorithm - Light augmentation for quick training
  fl_gamma: 0.0                        # No focal loss
  label_smoothing: 0.0                 # No smoothing
  iou: 0.7
  close_mosaic: 5                      # Minimal fine-tuning
  copy_paste: 0.0                      # No copy-paste
  degrees: 0.0                         # No rotation
  multi_scale: false
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  translate: 0.1
  scale: 0.5
  flip_lr: 0.5


# ─────────────────────────────────────────────────────────────────────────────
# PRESET 4: LARGE MODEL HIGH PRECISION (大模型高精度)
# ─────────────────────────────────────────────────────────────────────────────
# Best for: When yolo11n accuracy is not enough, have time for large model
# Time cost: ~25-35 hours on RTX 5070 Ti
# Expected mAP@0.5: 0.95-0.97 (yolo11s), 0.96-0.98 (yolo11m)
# WARNING: Reduce batch to 16 if using yolo11m or larger
# ─────────────────────────────────────────────────────────────────────────────

preset_large_model_precision:
  model: yolo11s.pt                    # or yolo11m.pt
  epochs: 600
  batch: 24                            # Reduced for larger models
  imgsz: 640
  optimizer: AdamW
  device: auto
  scheduler: cosine
  patience: 80
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 10
  workers: 6                           # Reduced for memory safety
  momentum: 0.937
  weight_decay: 0.0005
  # Algorithm - Strong augmentation for large model
  fl_gamma: 1.5
  label_smoothing: 0.1
  iou: 0.7
  close_mosaic: 25
  copy_paste: 0.15
  degrees: 15.0
  multi_scale: false
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.15
  scale: 0.6
  flip_lr: 0.5


# =============================================================================
# PRESET SELECTION GUIDE
# =============================================================================

# Use Case                    | Recommended Preset         | Model   | Time
# ───────────────────────────|───────────────────────────|─────────|──────
# Final production model     | preset_maximum_accuracy   | yolo11n | 15-20h
# Daily iteration            | preset_balanced ⭐         | yolo11n | 6-8h
# Quick testing              | preset_fast_experiment    | yolo11n | 1-2h
# Higher accuracy needed     | preset_large_model_precision | yolo11s | 25-35h

# =============================================================================
# HOW TO USE
# =============================================================================

# Method 1: Copy-Paste to project.yaml
#   1. Copy the preset section you want (including the key name)
#   2. Replace the entire 'training:' section in project.yaml
#   3. Save and restart the application

# Method 2: Manual Configuration in UI
#   1. Open YOLO Training Studio
#   2. Go to Training tab
#   3. Adjust parameters according to the preset values above
#   4. Start training

# Method 3: Quick Swap Template
#   Create backup files:
#   - project.yaml.maximum     (copy of preset_maximum_accuracy)
#   - project.yaml.balanced    (copy of preset_balanced)
#   - project.yaml.fast        (copy of preset_fast_experiment)
#   
#   Then copy the file you want:
#   cp project.yaml.balanced project.yaml

# =============================================================================
# PERFORMANCE COMPARISON (Estimated on RTX 5070 Ti, 10000 train images)
# =============================================================================

# Preset                    | mAP@0.5 | Time    | VRAM    | Stability
# ─────────────────────────|─────────|─────────|─────────|──────────
# Maximum Accuracy         | 92-95%  | 15-20h  | 9-11GB  | ★★★★★
# Balanced ⭐               | 90-93%  | 6-8h    | 9-11GB  | ★★★★★
# Fast Experiment          | 85-88%  | 1-2h    | 10-12GB | ★★★★☆
# Large Model Precision    | 95-98%  | 25-35h  | 12-14GB | ★★★★☆

# =============================================================================
# TIPS & TRICKS
# =============================================================================

# 1. Start with 'balanced' preset for most use cases
# 2. Use 'fast' preset to test new data or hyperparameters
# 3. Only use 'maximum' when you're sure about data quality
# 4. Monitor VRAM usage: nvidia-smi -l 1
# 5. If OOM occurs: reduce batch size by 8 (32→24→16)
# 6. Best epoch is usually at 60-80% of total epochs
# 7. Enable multi_scale for better generalization (costs ~2GB more VRAM)
# 8. Copy-paste augmentation is especially effective for rare classes

# =============================================================================
# DEVICE-SPECIFIC RECOMMENDATIONS
# =============================================================================

# RTX 5070 Ti (16GB VRAM):
#   - All presets work safely
#   - Can use batch=32 for yolo11n/yolo11s
#   - Reduce to batch=16 for yolo11m or larger

# RTX 4090 (24GB VRAM):
#   - Can increase batch sizes by 50%
#   - Enable multi_scale for all presets
#   - Try yolo11l with batch=16

# RTX 3080 (10GB VRAM):
#   - Reduce all batch sizes by 33%
#   - Disable copy_paste if OOM
#   - Use preset_balanced as maximum

# =============================================================================
