<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型训练提醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 40px;
            width: 100%;
        }

        .warning-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: iconPulse 1s infinite;
            filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.8));
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.8));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 40px rgba(255, 200, 0, 1));
            }
        }

        .main-text {
            color: #ffffff;
            font-size: 72px;
            font-weight: 900;
            line-height: 1.4;
            letter-spacing: 8px;
            animation: blink 1s infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                         0 0 40px rgba(255, 255, 255, 0.3),
                         0 0 60px rgba(255, 255, 255, 0.2);
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
                filter: brightness(1);
            }
            50% {
                opacity: 0.3;
                filter: brightness(0.5);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning-icon">⚠️</div>
        <div class="main-text">
            模型正在训练<br>
            请勿关闭电脑
        </div>
    </div>

    <script>
        // 防止意外关闭
        window.onbeforeunload = function(e) {
            e.preventDefault();
            e.returnValue = '模型正在训练中，确定要关闭吗？';
            return e.returnValue;
        };
    </script>
</body>
</html>
